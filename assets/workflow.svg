<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="How I work: I set the direction, a coordinating agent plans and assigns, specialist agents build in parallel, every change gets an independent review and automated CI, then it ships.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141417"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#55555f"/>
    </marker>
    <style>
      .t { font: 700 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
      .s { font: 500 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #a3a3ad; }
      .h { font: 700 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px; fill: #E5252A; }
      .box { fill: #1c1c21; stroke: #2f2f38; stroke-width: 1.5; }
      .key { fill: #1c1c21; stroke: #E5252A; stroke-width: 2; }
      .line { fill: none; stroke: #45454f; stroke-width: 2; }
      .pulse { fill: #E5252A; }
      .ok { fill: #3ddc97; }
    </style>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <text x="40" y="44" class="h">HOW I WORK</text>

  <!-- Flow lines -->
  <path id="p1" class="line" d="M215 200H265" marker-end="url(#arrow)"/>
  <path id="a1" class="line" d="M455 200C490 200 490 100 525 100" marker-end="url(#arrow)"/>
  <path id="a2" class="line" d="M455 200C490 200 490 165 525 165" marker-end="url(#arrow)"/>
  <path id="a3" class="line" d="M455 200C490 200 490 235 525 235" marker-end="url(#arrow)"/>
  <path id="a4" class="line" d="M455 200C490 200 490 300 525 300" marker-end="url(#arrow)"/>
  <path id="b1" class="line" d="M745 100C772 100 772 200 795 200"/>
  <path id="b2" class="line" d="M745 165C772 165 772 200 795 200"/>
  <path id="b3" class="line" d="M745 235C772 235 772 200 795 200"/>
  <path id="b4" class="line" d="M745 300C772 300 772 200 795 200"/>
  <path id="p2" class="line" d="M795 200H815" marker-end="url(#arrow)"/>
  <path id="p3" class="line" d="M965 200H995" marker-end="url(#arrow)"/>

  <!-- Me -->
  <rect x="40" y="150" width="175" height="100" rx="12" class="key"/>
  <text x="62" y="190" class="t">Me</text>
  <text x="62" y="214" class="s">Set direction,</text>
  <text x="62" y="232" class="s">approve every release</text>

  <!-- Coordinator -->
  <rect x="270" y="150" width="185" height="100" rx="12" class="box"/>
  <text x="292" y="190" class="t">Coordinator agent</text>
  <text x="292" y="214" class="s">Plans the work,</text>
  <text x="292" y="232" class="s">assigns and checks clashes</text>

  <!-- Specialists -->
  <text x="530" y="58" class="h">SPECIALIST AGENTS</text>
  <rect x="530" y="75" width="215" height="50" rx="10" class="box"/>
  <text x="550" y="106" class="t">Design &amp; UX</text>
  <rect x="530" y="140" width="215" height="50" rx="10" class="box"/>
  <text x="550" y="171" class="t">Lead Dev &amp; Integration</text>
  <rect x="530" y="210" width="215" height="50" rx="10" class="box"/>
  <text x="550" y="241" class="t">Security &amp; Data</text>
  <rect x="530" y="275" width="215" height="50" rx="10" class="box"/>
  <text x="550" y="306" class="t">UX Copy &amp; QA</text>

  <!-- Review and CI -->
  <rect x="820" y="150" width="145" height="100" rx="12" class="box"/>
  <text x="840" y="190" class="t">Independent</text>
  <text x="840" y="210" class="t">review</text>
  <text x="840" y="234" class="s">A different model</text>

  <rect x="1000" y="150" width="160" height="100" rx="12" class="box"/>
  <text x="1022" y="190" class="t">CI, then ship</text>
  <text x="1022" y="214" class="s">Tests, lint and</text>
  <text x="1022" y="232" class="s">audits must pass</text>
  <circle cx="1140" cy="172" r="7" class="ok"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>

  <!-- Work moving through -->
  <circle r="5" class="pulse"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="5" class="pulse"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
  <circle r="5" class="pulse"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
  <circle r="5" class="pulse"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
  <circle r="5" class="pulse"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#a4"/></animateMotion></circle>
  <circle r="5" class="pulse"><animateMotion dur="2.4s" begin="0.3s" repeatCount="indefinite"><mpath href="#b1"/></animateMotion></circle>
  <circle r="5" class="pulse"><animateMotion dur="2.4s" begin="0.9s" repeatCount="indefinite"><mpath href="#b2"/></animateMotion></circle>
  <circle r="5" class="pulse"><animateMotion dur="2.4s" begin="1.5s" repeatCount="indefinite"><mpath href="#b3"/></animateMotion></circle>
  <circle r="5" class="pulse"><animateMotion dur="2.4s" begin="2.1s" repeatCount="indefinite"><mpath href="#b4"/></animateMotion></circle>
  <circle r="5" class="pulse"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
</svg>
